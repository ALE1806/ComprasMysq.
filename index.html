// ---------- Funciones que hablan con la base ----------
async function validarCodigoEmpleado(codigo, area, sucursal) {
  const { data, error } = await db.rpc('fn_validar_codigo', { p_codigo: codigo, p_area: area, p_sucursal: sucursal || null });
  if (error) throw error;
  return data && data.length > 0 ? data[0] : null;
}
async function validarAdmin(codigo) {
  const { data, error } = await db.rpc('fn_admin_valido', { p_admin_codigo: codigo });
  if (error) throw error;
  return !!data;
}
async function listarEmpleadosAdmin(adminCodigo) {
  const { data, error } = await db.rpc('fn_admin_listar_empleados', { p_admin_codigo: adminCodigo });
  if (error) throw error;
  return data || [];
}
async function altaEmpleado(adminCodigo, nombre, area, sucursal, codigo) {
  const { data, error } = await db.rpc('fn_admin_alta_empleado', { p_admin_codigo: adminCodigo, p_nombre: nombre, p_area: area, p_sucursal: sucursal, p_codigo: codigo });
  if (error) throw error;
  return data;
}
async function bajaEmpleado(adminCodigo, empleadoId) {
  const { error } = await db.rpc('fn_admin_baja_empleado', { p_admin_codigo: adminCodigo, p_empleado_id: empleadoId });
  if (error) throw error;
}
async function altaProducto(adminCodigo, nombre, unidad) {
  const { data, error } = await db.rpc('fn_admin_alta_producto', { p_admin_codigo: adminCodigo, p_id: null, p_nombre: nombre, p_unidad: unidad });
  if (error) throw error;
  return data;
}
async function bajaProducto(adminCodigo, id) {
  const { error } = await db.rpc('fn_admin_baja_producto', { p_admin_codigo: adminCodigo, p_id: id });
  if (error) throw error;
}
async function obtenerCatalogo() {
  const { data, error } = await db.from('catalogo_productos').select('*').order('nombre');
  if (error) throw error;
  return data || [];
}
async function obtenerPedidos() {
  const { data, error } = await db.from('pedidos').select('*, pedido_productos(*)').order('fecha_creacion', { ascending: false });
  if (error) throw error;
  return (data || []).map((p) => ({ ...p, productos: p.pedido_productos || [] }));
}
async function dbCrearPedido(sucursal, creadoPor, productosRows) {
  const { data: pedido, error: errPedido } = await db.from('pedidos').insert({ sucursal, creado_por: creadoPor }).select().single();
  if (errPedido) throw errPedido;
  const filas = productosRows.map((r) => ({
    pedido_id: pedido.id,
    tipo: r.tipo,
    nombre: r.nombre,
    unidad: r.unidad,
    cantidad: r.cantidad,
    catalogo_id: r.catalogId || null,
    cliente: r.cliente || null,
  }));
  const { error: errProd } = await db.from('pedido_productos').insert(filas);
  if (errProd) throw errProd;
  return pedido;
}
async function dbConfirmarEntrega(pedidoId, items, entregadoPor, recibidoPor) {
  for (const it of items) {
    const { error } = await db.from('pedido_productos').update({
      entregado: it.entregado, cantidad_entregada: it.cantidad_entregada, nota: it.nota || null,
    }).eq('id', it.id);
    if (error) throw error;
  }
  const { error: errPedido } = await db.from('pedidos').update({
    estado: 'entregado', entregado_por: entregadoPor, recibido_por: recibidoPor, fecha_entrega: new Date().toISOString(),
  }).eq('id', pedidoId);
  if (errPedido) throw errPedido;
}
async function dbCancelarPedido(pedidoId, canceladoPor) {
  const { error } = await db.from('pedidos').update({ estado: 'cancelado', cancelado_por: canceladoPor }).eq('id', pedidoId);
  if (error) throw error;
}

const C = {
  bg: '#F6F4EE', surface: '#FFFFFF', ink: '#1E241F', inkMuted: '#767D70', inkFaint: '#A6AB9C', border: '#E4E0D3',
  accent: '#124F9F', accentSoft: '#E7EEF8', gold: '#E69A09', goldSoft: '#FBF0DC',
  pendiente: '#AD7A0A', pendienteSoft: '#FBF0DC', completo: '#1F8A5F', completoSoft: '#E6F4EC',
  parcial: '#BE4B22', parcialSoft: '#FAEAE0', cancelado: '#8B8676', canceladoSoft: '#EDEAE0',
  especial: '#6E5AA0', especialSoft: '#EFEAF6',
};

function uid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
function formatFecha(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch { return iso; }
}
function estadoDe(pedido) {
  if (pedido.estado !== 'entregado') return pedido.estado;
  const completo = pedido.productos.every((p) => p.entregado && Number(p.cantidad_entregada) >= Number(p.cantidad));
  return completo ? 'completo' : 'parcial';
}
const ESTADO_META = {
  pendiente: { label: 'Pendiente', color: C.pendiente, bg: C.pendienteSoft, Icon: Clock },
  completo: { label: 'Entregado', color: C.completo, bg: C.completoSoft, Icon: CheckCircle2 },
  parcial: { label: 'Entregado parcial', color: C.parcial, bg: C.parcialSoft, Icon: AlertCircle },
  cancelado: { label: 'Cancelado', color: C.cancelado, bg: C.canceladoSoft, Icon: XIcon },
};

function Pill({ estado }) {
  const meta = ESTADO_META[estado] || ESTADO_META.pendiente;
  const { Icon } = meta;
  return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold shrink-0" style={{ background: meta.bg, color: meta.color }}><Icon size={13} strokeWidth={2.5} />{meta.label}</span>;
}
function EspecialTag() {
  return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide shrink-0" style={{ background: C.especialSoft, color: C.especial }}><Sparkles size={10} /> Especial</span>;
}
function TopBar({ title, subtitle, onBack, right }) {
  return (
    <div className="flex items-start justify-between gap-3 mb-5">
      <div className="flex items-start gap-2">
        {onBack && <button onClick={onBack} className="mt-0.5 shrink-0 rounded-full p-1.5 hover:bg-black/5 active:scale-95 transition" style={{ color: C.ink }}><ChevronLeft size={20} /></button>}
        <div>
          <h1 className="text-lg font-bold leading-tight" style={{ color: C.ink }}>{title}</h1>
          {subtitle && <p className="text-sm mt-0.5" style={{ color: C.inkMuted }}>{subtitle}</p>}
        </div>
      </div>
      {right}
    </div>
  );
}
function EmptyState({ Icon, title, sub }) {
  return (
    <div className="flex flex-col items-center text-center py-14 px-6 rounded-2xl border border-dashed" style={{ borderColor: C.border }}>
      <div className="rounded-full p-3 mb-3" style={{ background: C.accentSoft }}><Icon size={22} style={{ color: C.accent }} /></div>
      <p className="font-semibold text-sm" style={{ color: C.ink }}>{title}</p>
      {sub && <p className="text-xs mt-1 max-w-[220px]" style={{ color: C.inkMuted }}>{sub}</p>}
    </div>
  );
}
function Stamp({ active, onClick }) {
  return (
    <button type="button" onClick={onClick} className="shrink-0 rounded-full flex items-center justify-center transition-all duration-150"
      style={{ width: 34, height: 34, border: `2px solid ${active ? C.completo : C.border}`, background: active ? C.completoSoft : 'transparent', transform: active ? 'rotate(-4deg)' : 'none' }}>
      <Check size={16} strokeWidth={3} style={{ color: active ? C.completo : C.inkFaint }} />
    </button>
  );
}
function CodeField({ value, onChange, placeholder, onEnter }) {
  const [show, setShow] = useState(false);
  return (
    <div className="relative">
      <input type={show ? 'text' : 'password'} value={value} onChange={(e) => onChange(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter' && onEnter) onEnter(); }} placeholder={placeholder}
        className="w-full text-sm rounded-lg pl-3 pr-10 py-2.5 outline-none border tracking-wide" style={{ borderColor: C.border, color: C.ink }} autoFocus />

function CodigoScreen({ preRole, onBack, onSuccess }) {
  const [codigo, setCodigo] = useState('');
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);
  const submit = async () => {
    const val = codigo.trim();
    if (!val || checking) return;
    setChecking(true);
    try {
      const emp = await validarCodigoEmpleado(val, preRole.type, preRole.type === 'sucursal' ? preRole.nombre : null);
      if (emp) { setError(''); onSuccess(emp); }
      else setError('Código incorrecto. Verifica con el administrador.');
    } catch (e) {
      setError('No se pudo verificar. Revisa tu conexión e intenta de nuevo.');
    } finally { setChecking(false); }
  };
  return (
    <div>
      <TopBar title={preRole.type === 'sucursal' ? preRole.nombre : 'Compras'} subtitle="Ingresa tu código personal" onBack={onBack} />

        {checking ? 'Verificando…' : 'Entrar'}
      </button>
    </div>
  );
}

function EmpleadosAdmin({ empleados, loading, onAdd, onDelete, saving }) {
  const [nombre, setNombre] = useState('');
  const [area, setArea] = useState('sucursal');
  const [sucursal, setSucursal] = useState(SUCURSALES[0]);
  const [codigo, setCodigo] = useState('');
  const [error, setError] = useState('');

  const submit = async () => {
    if (!nombre.trim() || !codigo.trim()) return;
    const dup = empleados.some((e) => e.codigo.toUpperCase() === codigo.trim().toUpperCase());
    if (dup) { setError('Ese código ya está en uso por otro empleado.'); return; }
    try {
      await onAdd(nombre.trim(), area, area === 'sucursal' ? sucursal : null, codigo.trim());
      setNombre(''); setCodigo(''); setError('');
    } catch (e) {
      setError(e.message || 'No se pudo agregar el empleado.');
    }
  };

  const ordenados = useMemo(() => [...empleados].sort((a, b) => a.nombre.localeCompare(b.nombre)), [empleados]);

  return (
    <div>
      <div className="p-3.5 rounded-xl border mb-5" style={{ borderColor: C.border, background: C.surface }}>
        <p className="text-xs font-bold uppercase tracking-wide mb-2.5" style={{ color: C.inkFaint }}>Dar de alta empleado</p>
        <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Nombre completo" className="w-full text-sm rounded-lg px-3 py-2 mb-2 outline-none border" style={{ borderColor: C.border, color: C.ink }} />
        <div className="flex gap-1.5 mb-2">
          {['sucursal', 'compras', 'todas'].map((a) => (
            <button key={a} onClick={() => setArea(a)} className="flex-1 py-2 rounded-lg text-[11px] font-bold border px-1"
              style={{ borderColor: area === a ? C.accent : C.border, background: area === a ? C.accentSoft : 'transparent', color: area === a ? C.accent : C.inkMuted }}>
              {a === 'sucursal' ? 'Sucursal' : a === 'compras' ? 'Compras' : 'Todas'}
            </button>
          ))}
        </div>
        {area === 'todas' && <p className="text-xs mb-2 px-1" style={{ color: C.especial }}>Su código funcionará en cualquier sucursal o en Compras — para jefes o administrativos que apoyan en varias áreas.</p>}
        {area === 'sucursal' && (
          <select value={sucursal} onChange={(e) => setSucursal(e.target.value)} className="w-full text-sm rounded-lg px-3 py-2 mb-2 outline-none border" style={{ borderColor: C.border, color: C.ink }}>
            {SUCURSALES.map((s) => <option key={s} value={s}>{s}</option>)}

        <input value={codigo} onChange={(e) => setCodigo(e.target.value)} placeholder="Código que usará para entrar" className="w-full text-sm rounded-lg px-3 py-2 mb-2 outline-none border tracking-wide" style={{ borderColor: C.border, color: C.ink }} />
        {error && <p className="text-xs mb-2 font-medium" style={{ color: C.parcial }}>{error}</p>}
        <button disabled={!nombre.trim() || !codigo.trim() || saving} onClick={submit} className="w-full py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40" style={{ background: C.accent }}>
          {saving ? 'Guardando…' : 'Agregar empleado'}
        </button>
      </div>

      <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: C.inkFaint }}>
        {loading ? 'Cargando…' : `${empleados.length} empleado${empleados.length !== 1 ? 's' : ''} dado${empleados.length !== 1 ? 's' : ''} de alta`}
      </p>

      {!loading && ordenados.length === 0 ? (
        <EmptyState Icon={Users} title="Sin empleados" sub="Agrega a cada persona con el código que va a usar para entrar." />
      ) : (
        <div className="rounded-xl border overflow-hidden" style={{ borderColor: C.border, background: C.surface }}>

              </div>
              <button onClick={() => onDelete(e.id)} className="p-1.5 rounded hover:bg-black/5 shrink-0"><Trash2 size={14} style={{ color: C.inkMuted }} /></button>

function AdminPanel({ adminCodigo, catalogo, onRefreshCatalogo, onBack }) {
  const [tab, setTab] = useState('empleados');
  const [empleados, setEmpleados] = useState([]);
  const [loadingEmp, setLoadingEmp] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const cargarEmpleados = useCallback(async () => {
    try { setEmpleados(await listarEmpleadosAdmin(adminCodigo)); setError(''); }
    catch (e) { setError('No se pudo cargar la lista de empleados.'); }
    finally { setLoadingEmp(false); }
  }, [adminCodigo]);
  useEffect(() => { cargarEmpleados(); }, [cargarEmpleados]);

  const handleAddEmpleado = async (nombre, area, sucursal, codigo) => {
    setSaving(true);
    try { await altaEmpleado(adminCodigo, nombre, area, sucursal, codigo); await cargarEmpleados(); }
    finally { setSaving(false); }
  };
  const handleDeleteEmpleado = async (id) => {
    setSaving(true);
    try { await bajaEmpleado(adminCodigo, id); await cargarEmpleados(); }
    catch (e) { setError('No se pudo eliminar.'); }
    finally { setSaving(false); }
  };
  const handleAddProducto = async (nombre, unidad) => {
    setSaving(true);
    try { await altaProducto(adminCodigo, nombre, unidad); await onRefreshCatalogo(); }
    catch (e) { setError('No se pudo agregar el producto.'); }
    finally { setSaving(false); }
  };
  const handleDeleteProducto = async (id) => {
    setSaving(true);
    try { await bajaProducto(adminCodigo, id); await onRefreshCatalogo(); }
    catch (e) { setError('No se pudo eliminar el producto.'); }
    finally { setSaving(false); }
  };

  return (
    <div>
      <TopBar title="Administración" subtitle="Empleados y catálogo" onBack={onBack} />
      {error && <div className="mb-3 px-3 py-2 rounded-lg text-xs font-medium" style={{ background: C.parcialSoft, color: C.parcial }}>{error}</div>}
      <div className="flex gap-1.5 mb-5">
        {[['empleados', 'Empleados'], ['catalogo', 'Catálogo']].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} className="px-3.5 py-1.5 rounded-full text-xs font-bold border"
            style={{ borderColor: tab === key ? C.accent : C.border, background: tab === key ? C.accent : 'transparent', color: tab === key ? '#fff' : C.inkMuted }}>{label}</button>
        ))}
      </div>
      {tab === 'empleados'
        ? <EmpleadosAdmin empleados={empleados} loading={loadingEmp} onAdd={handleAddEmpleado} onDelete={handleDeleteEmpleado} saving={saving} />
        : <CatalogoAdmin catalogo={catalogo} onAdd={handleAddProducto} onDelete={handleDeleteProducto} saving={saving} />}
    </div>
  );
}

  const changeCantidadCatalogo = (id, val) => setRows((rs) => rs.map((r) => (r.id === id ? { ...r, cantidad: val } : r)));
  const changeEspecial = (id, field, val) => setRows((rs) => rs.map((r) => (r.id === id ? { ...r, [field]: val } : r)));
  const validRows = rows.filter((r) => (r.tipo === 'catalogo' ? (r.catalogId && Number(r.cantidad) > 0) : (r.nombre.trim() && Number(r.cantidad) > 0)));
  const canSubmit = validRows.length > 0 && !saving;
  const buildPayload = () => validRows.map((r) => (r.tipo === 'catalogo'
    ? { tipo: 'catalogo', nombre: r.nombre, unidad: r.unidad, cantidad: Number(r.cantidad), catalogId: r.catalogId }
    : { tipo: 'especial', nombre: r.nombre.trim(), unidad: r.unidad.trim() || 'pza', cantidad: Number(r.cantidad), cliente: r.cliente.trim() }));
  return (
    <div>
      <TopBar title="Nuevo pedido" subtitle={sucursal} onBack={onCancel} />
      {rows.length === 0 && <div className="mb-3"><EmptyState Icon={ClipboardList} title="Agrega tu primer producto" sub="Del catálogo, o especial si es algo nuevo para un cliente." /></div>}
      <div className="space-y-2.5 mb-3">
        {rows.map((r) => (r.tipo === 'catalogo'
          ? <CatalogRow key={r.id} row={r} catalogo={catalogo} onSelect={selectCatalogItem} onChangeCantidad={changeCantidadCatalogo} onClear={() => clearCatalog(r.id)} onRemove={removeRow} />
          : <EspecialRow key={r.id} row={r} onChange={changeEspecial} onRemove={removeRow} />))}
      </div>
      <div className="flex gap-2 mb-5">
        <button onClick={addCatalogo} className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl border border-dashed text-sm font-semibold" style={{ borderColor: C.border, color: C.accent }}><Plus size={16} /> Del catálogo</button>
        <button onClick={addEspecial} className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl border border-dashed text-sm font-semibold" style={{ borderColor: C.especial, color: C.especial }}><Plus size={16} /> Producto especial</button>
      </div>
      <button disabled={!canSubmit} onClick={() => onCreate(buildPayload())} className="w-full py-3 rounded-xl font-semibold text-sm text-white transition disabled:opacity-40" style={{ background: C.accent }}>
        {saving ? 'Guardando…' : `Levantar pedido${validRows.length ? ` (${validRows.length})` : ''}`}
      </button>
    </div>
  );
}

// ---------- Detalle / listas ----------
function DetallePedido({ pedido, onBack, onCancelar }) {
  const estado = estadoDe(pedido);
  const entregado = pedido.estado === 'entregado';
  return (
    <div>
      <TopBar title={pedido.sucursal} subtitle={`${formatFecha(pedido.fecha_creacion)}${pedido.creado_por ? ' · ' + pedido.creado_por : ''}`} onBack={onBack} />
      <div className="mb-4"><Pill estado={estado} /></div>
      <div className="rounded-xl border overflow-hidden mb-4" style={{ borderColor: C.border, background: C.surface }}>
        {pedido.productos.map((p, i) => (
          <div key={p.id} className="flex items-center justify-between px-3.5 py-3 text-sm" style={{ borderTop: i > 0 ? `1px solid ${C.border}` : 'none' }}>
            <div className="min-w-0">
              <div className="flex items-center gap-1.5 flex-wrap"><p className="font-medium truncate" style={{ color: C.ink }}>{p.nombre}</p>{p.tipo === 'especial' && <EspecialTag />}</div>
              {p.cliente && <p className="text-xs mt-0.5" style={{ color: C.especial }}>Para: {p.cliente}</p>}
              <p className="text-xs mt-0.5" style={{ color: C.inkMuted }}>
                Pedido: {p.cantidad} {p.unidad}
                {entregado && (<>{' · '}<span style={{ color: Number(p.cantidad_entregada) >= Number(p.cantidad) && p.entregado ? C.completo : C.parcial, fontWeight: 600 }}>Entregado: {p.entregado ? `${p.cantidad_entregada} ${p.unidad}` : '0'}</span></>)}
              </p>
              {p.nota && <p className="text-xs italic mt-0.5" style={{ color: C.inkFaint }}>Nota: {p.nota}</p>}
            </div>
            {entregado && (p.entregado && Number(p.cantidad_entregada) >= Number(p.cantidad) ? <CheckCircle2 size={18} style={{ color: C.completo }} className="shrink-0 ml-2" /> : <AlertCircle size={18} style={{ color: C.parcial }} className="shrink-0 ml-2" />)}
          </div>
        ))}
      </div>
      {entregado && (
        <div className="rounded-xl border p-4 mb-4" style={{ borderColor: C.border, background: C.surface }}>
          <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{ color: C.inkFaint }}>Firmas de entrega</p>
          <div className="flex justify-between gap-4 mb-3">
            <div className="flex-1"><p className="text-[11px]" style={{ color: C.inkMuted }}>Entregó (compras)</p><p className="text-sm font-semibold italic pb-1 border-b" style={{ color: C.ink, borderColor: C.border }}>{pedido.entregado_por || '—'}</p></div>
            <div className="flex-1"><p className="text-[11px]" style={{ color: C.inkMuted }}>Recibió (sucursal)</p><p className="text-sm font-semibold italic pb-1 border-b" style={{ color: C.ink, borderColor: C.border }}>{pedido.recibido_por || '—'}</p></div>
          </div>
          <p className="text-xs" style={{ color: C.inkFaint }}>Entregado el {formatFecha(pedido.fecha_entrega)}</p>
        </div>
      )}
      {pedido.estado === 'pendiente' && onCancelar && <button onClick={onCancelar} className="w-full py-2.5 rounded-xl border text-sm font-semibold" style={{ borderColor: C.parcial, color: C.parcial }}>Cancelar pedido</button>}
    </div>
  );
}
function VistaSucursal({ sucursal, pedidos, onNuevo, onOpen, refreshing }) {
  const mios = useMemo(() => pedidos.filter((p) => p.sucursal === sucursal).sort((a, b) => new Date(b.fecha_creacion) - new Date(a.fecha_creacion)), [pedidos, sucursal]);
  return (
    <div>
      <button onClick={onNuevo} className="w-full flex items-center justify-center gap-1.5 py-3 rounded-xl font-semibold text-sm text-white mb-5" style={{ background: C.accent }}><Plus size={17} /> Nuevo pedido</button>
      <div className="flex items-center justify-between mb-2.5">
        <p className="text-xs font-bold uppercase tracking-wide" style={{ color: C.inkFaint }}>Mis pedidos</p>
        {refreshing && <RefreshCw size={12} className="animate-spin" style={{ color: C.inkFaint }} />}
      </div>
      {mios.length === 0 ? <EmptyState Icon={ClipboardList} title="Sin pedidos todavía" sub="Levanta tu primer pedido para que compras lo surta." /> : (
        <div className="space-y-2">
          {mios.map((p) => {
            const estado = estadoDe(p); const meta = ESTADO_META[estado]; const tieneEspecial = p.productos.some((x) => x.tipo === 'especial');
            return (
              <button key={p.id} onClick={() => onOpen(p.id)} className="w-full flex items-center justify-between gap-3 p-3.5 rounded-xl border text-left active:scale-[0.99] transition" style={{ borderColor: C.border, background: C.surface, borderLeft: `4px solid ${meta.color}` }}>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5"><p className="font-semibold text-sm" style={{ color: C.ink }}>{p.productos.length} producto{p.productos.length !== 1 ? 's' : ''}</p>{tieneEspecial && <EspecialTag />}</div>
                  <p className="text-xs mt-0.5" style={{ color: C.inkMuted }}>{formatFecha(p.fecha_creacion)}{p.creado_por ? ` · ${p.creado_por}` : ''}</p>
                </div>
                <div className="flex items-center gap-1.5 shrink-0"><Pill estado={estado} /><ChevronRight size={16} style={{ color: C.inkFaint }} /></div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}
function VistaComprasCola({ pendientes, onAbrir, refreshing }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-2.5">
        <p className="text-xs font-bold uppercase tracking-wide" style={{ color: C.inkFaint }}>Pedidos por surtir {pendientes.length > 0 && `(${pendientes.length})`}</p>
        {refreshing && <RefreshCw size={12} className="animate-spin" style={{ color: C.inkFaint }} />}
      </div>
      {pendientes.length === 0 ? <EmptyState Icon={Package} title="No hay pedidos pendientes" sub="Cuando una sucursal levante un pedido, aparecerá aquí." /> : (
        <div className="space-y-2">
          {pendientes.map((p) => {
            const tieneEspecial = p.productos.some((x) => x.tipo === 'especial');
            return (
              <button key={p.id} onClick={() => onAbrir(p.id)} className="w-full flex items-center justify-between gap-3 p-3.5 rounded-xl border text-left active:scale-[0.99] transition" style={{ borderColor: C.border, background: C.surface, borderLeft: `4px solid ${C.pendiente}` }}>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5"><p className="font-semibold text-sm" style={{ color: C.ink }}>{p.sucursal}</p>{tieneEspecial && <EspecialTag />}</div>
                  <p className="text-xs mt-0.5" style={{ color: C.inkMuted }}>{p.productos.length} producto{p.productos.length !== 1 ? 's' : ''} · {formatFecha(p.fecha_creacion)}</p>
                </div>
                <ChevronRight size={16} style={{ color: C.inkFaint }} className="shrink-0" />
              </button>
            );
          })}
        </div>
      )}

  );
}
function VistaEntrega({ pedido, role, onBack, onConfirmar, saving }) {
  const [items, setItems] = useState(() => pedido.productos.map((p) => ({ ...p, entregado: p.entregado ?? true, cantidad_entregada: p.cantidad_entregada ?? p.cantidad, nota: p.nota ?? '' })));
  const [codigoRecibe, setCodigoRecibe] = useState('');
  const [empleadoRecibe, setEmpleadoRecibe] = useState(null);
  const [verificando, setVerificando] = useState(false);

  useEffect(() => {
    const val = codigoRecibe.trim();
    if (!val) { setEmpleadoRecibe(null); return; }
    setVerificando(true);
    const t = setTimeout(async () => {
      try { setEmpleadoRecibe(await validarCodigoEmpleado(val, 'sucursal', pedido.sucursal)); }
      catch { setEmpleadoRecibe(null); }
      finally { setVerificando(false); }
    }, 400);
    return () => clearTimeout(t);
  }, [codigoRecibe, pedido.sucursal]);

  const toggle = (id) => setItems((its) => its.map((it) => (it.id === id ? { ...it, entregado: !it.entregado } : it)));
  const setCantidad = (id, val) => setItems((its) => its.map((it) => (it.id === id ? { ...it, cantidad_entregada: val } : it)));
  const setNota = (id, val) => setItems((its) => its.map((it) => (it.id === id ? { ...it, nota: val } : it)));
  const canConfirm = !!empleadoRecibe && !saving;

  return (
    <div>
      <TopBar title={`Surtir · ${pedido.sucursal}`} subtitle={formatFecha(pedido.fecha_creacion)} onBack={onBack} />
      <div className="rounded-xl border overflow-hidden mb-4" style={{ borderColor: C.border, background: C.surface }}>
        {items.map((it, i) => (
          <div key={it.id} className="flex items-start gap-3 px-3.5 py-3" style={{ borderTop: i > 0 ? `1px solid ${C.border}` : 'none' }}>
            <Stamp active={it.entregado} onClick={() => toggle(it.id)} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5 flex-wrap mb-0.5"><p className="font-medium text-sm" style={{ color: C.ink }}>{it.nombre}</p>{it.tipo === 'especial' && <EspecialTag />}</div>
              {it.cliente && <p className="text-xs mb-1" style={{ color: C.especial }}>Para: {it.cliente}</p>}
              <p className="text-xs mb-2" style={{ color: C.inkMuted }}>Pedido: {it.cantidad} {it.unidad}</p>
              <div className="flex gap-2">
                <input type="number" min="0" disabled={!it.entregado} value={it.cantidad_entregada} onChange={(e) => setCantidad(it.id, e.target.value)} className="w-24 text-sm rounded-lg px-2.5 py-1.5 outline-none border disabled:opacity-40" style={{ borderColor: C.border, color: C.ink }} />
                <input placeholder="Nota (opcional)" value={it.nota} onChange={(e) => setNota(it.id, e.target.value)} className="flex-1 text-sm rounded-lg px-2.5 py-1.5 outline-none border" style={{ borderColor: C.border, color: C.ink }} />
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="rounded-xl border p-4 mb-5" style={{ borderColor: C.border, background: C.surface }}>
        <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{ color: C.inkFaint }}>Firmar entrega</p>
        <p className="text-[11px] mb-1" style={{ color: C.inkMuted }}>Entregó</p>
        <p className="text-sm font-semibold italic pb-2 mb-3 border-b" style={{ color: C.ink, borderColor: C.border }}>{role.nombre}</p>
        <label className="block text-[11px] mb-1" style={{ color: C.inkMuted }}>Código de quien recibe (lo teclea la persona de la sucursal)</label>
        <CodeField value={codigoRecibe} onChange={setCodigoRecibe} placeholder="Código de quien recibe" />
        {codigoRecibe.trim().length > 0 && !verificando && (empleadoRecibe
          ? <p className="text-xs mt-1.5 font-medium" style={{ color: C.completo }}>✓ {empleadoRecibe.nombre}</p>
          : <p className="text-xs mt-1.5 font-medium" style={{ color: C.parcial }}>Código no reconocido en {pedido.sucursal}.</p>)}
      </div>
      <button disabled={!canConfirm} onClick={() => onConfirmar(items, role.nombre, empleadoRecibe.nombre)} className="w-full py-3 rounded-xl font-semibold text-sm text-white disabled:opacity-40" style={{ background: C.accent }}>
        {saving ? 'Guardando…' : 'Confirmar entrega'}
      </button>
    </div>
  );
}
function VistaHistorial({ pedidos, onOpen }) {
  const [filtro, setFiltro] = useState('todas');
  const historial = useMemo(() => pedidos.filter((p) => p.estado !== 'pendiente').filter((p) => filtro === 'todas' || p.sucursal === filtro).sort((a, b) => new Date(b.fecha_entrega || b.fecha_creacion) - new Date(a.fecha_entrega || a.fecha_creacion)), [pedidos, filtro]);
  return (
    <div>
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {['todas', ...SUCURSALES].map((s) => (
          <button key={s} onClick={() => setFiltro(s)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border"
            style={{ borderColor: filtro === s ? C.accent : C.border, background: filtro === s ? C.accentSoft : 'transparent', color: filtro === s ? C.accent : C.inkMuted }}>{s === 'todas' ? 'Todas' : s}</button>
        ))}
      </div>
      {historial.length === 0 ? <EmptyState Icon={ClipboardList} title="Sin historial" sub="Aquí aparecerán los pedidos ya entregados o cancelados." /> : (
        <div className="space-y-2">
          {historial.map((p) => {
            const estado = estadoDe(p); const meta = ESTADO_META[estado];
            return (
              <button key={p.id} onClick={() => onOpen(p.id)} className="w-full flex items-center justify-between gap-3 p-3.5 rounded-xl border text-left active:scale-[0.99] transition" style={{ borderColor: C.border, background: C.surface, borderLeft: `4px solid ${meta.color}` }}>
                <div className="min-w-0"><p className="font-semibold text-sm" style={{ color: C.ink }}>{p.sucursal}</p><p className="text-xs mt-0.5" style={{ color: C.inkMuted }}>{p.productos.length} producto{p.productos.length !== 1 ? 's' : ''} · {formatFecha(p.fecha_entrega || p.fecha_creacion)}</p></div>
                <Pill estado={estado} />
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- App ----------
function Shell({ children, error }) {
  return (
    <div className="min-h-screen w-full" style={{ background: C.bg, fontFamily: "ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" }}>
      <div className="max-w-lg mx-auto px-4 py-6">
        {error && <div className="mb-3 px-3 py-2 rounded-lg text-xs font-medium" style={{ background: C.parcialSoft, color: C.parcial }}>{error}</div>}
        {children}
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState('seleccion');
  const [preRole, setPreRole] = useState(null);
  const [role, setRole] = useState(null);
  const [adminCodigo, setAdminCodigo] = useState(null);

  const [pedidos, setPedidos] = useState([]);
  const [catalogo, setCatalogo] = useState([]);
  const [loadingPedidos, setLoadingPedidos] = useState(true);
  const [loadingCatalogo, setLoadingCatalogo] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const [screen, setScreen] = useState('lista');
  const [previousScreen, setPreviousScreen] = useState('lista');
  const [activeId, setActiveId] = useState(null);
  const [comprasTab, setComprasTab] = useState('cola');

  const cargarCatalogo = useCallback(async () => {
    try { setCatalogo(await obtenerCatalogo()); }
    catch (e) { /* deja el catálogo anterior */ }
    finally { setLoadingCatalogo(false); }
  }, []);
  useEffect(() => { cargarCatalogo(); }, [cargarCatalogo]);

  const cargarPedidos = useCallback(async (silent) => {
    if (!silent) setLoadingPedidos(true); else setRefreshing(true);
    try { setPedidos(await obtenerPedidos()); setError(''); }
    catch (e) { setError('No se pudo actualizar. Revisa tu conexión.'); }
    finally { setLoadingPedidos(false); setRefreshing(false); }
  }, []);
  useEffect(() => { if (mode === 'app') cargarPedidos(false); }, [mode, cargarPedidos]);
  useEffect(() => {
    if (mode !== 'app') return;
    const interval = setInterval(() => cargarPedidos(true), 8000);
    return () => clearInterval(interval);
  }, [mode, cargarPedidos]);

  const salir = () => { setRole(null); setPreRole(null); setMode('seleccion'); setScreen('lista'); setActiveId(null); setComprasTab('cola'); };
  const abrirCatalogo = () => { setPreviousScreen(screen); setScreen('catalogo'); };
  const salirCatalogo = () => setScreen(previousScreen);

  const crearPedido = async (productosRows) => {
    setSaving(true);
    try { await dbCrearPedido(role.sucursal, role.nombre, productosRows); await cargarPedidos(true); setScreen('lista'); }
    catch (e) { setError('No se pudo guardar el pedido.'); }
    finally { setSaving(false); }
  };
  const cancelarPedido = async (id) => {
    try { await dbCancelarPedido(id, role.nombre); await cargarPedidos(true); setScreen('lista'); }
    catch (e) { setError('No se pudo cancelar el pedido.'); }
  };
  const confirmarEntrega = async (items, entregadoPor, recibidoPor) => {
    setSaving(true);
    try { await dbConfirmarEntrega(activeId, items, entregadoPor, recibidoPor); await cargarPedidos(true); setComprasTab('cola'); setScreen('lista'); setActiveId(null); }
    catch (e) { setError('No se pudo confirmar la entrega.'); }
    finally { setSaving(false); }
  };

  const pedidoActivo = pedidos.find((p) => p.id === activeId);

  if (mode === 'seleccion') {
    return <Shell error={error}><RoleSelector onSucursal={(nombre) => { setPreRole({ type: 'sucursal', nombre }); setMode('codigo'); }} onCompras={() => { setPreRole({ type: 'compras' }); setMode('codigo'); }} onAdmin={() => setMode('admin-gate')} /></Shell>;
  }
  if (mode === 'codigo') {
    return <Shell error={error}><CodigoScreen preRole={preRole} onBack={() => setMode('seleccion')} onSuccess={(emp) => { setRole({ type: preRole.type, nombre: emp.nombre, sucursal: preRole.type === 'sucursal' ? preRole.nombre : undefined, empleadoId: emp.empleado_id }); setMode('app'); setScreen('lista'); }} /></Shell>;
  }
  if (mode === 'admin-gate') {
    return <Shell error={error}><AdminGateScreen onBack={() => setMode('seleccion')} onSuccess={(codigo) => { setAdminCodigo(codigo); setMode('admin'); }} /></Shell>;
  }
  if (mode === 'admin') {
    return <Shell error={error}><AdminPanel adminCodigo={adminCodigo} catalogo={catalogo} onRefreshCatalogo={cargarCatalogo} onBack={() => { setAdminCodigo(null); setMode('seleccion'); }} /></Shell>;
  }

  let content;
  if (loadingPedidos || loadingCatalogo) {
    content = <div className="py-20 text-center text-sm" style={{ color: C.inkMuted }}>Cargando…</div>;
  } else if (screen === 'catalogo') {
    content = <CatalogoBrowse catalogo={catalogo} onBack={salirCatalogo} />;
  } else if (role.type === 'sucursal') {
    if (screen === 'nuevo') content = <NuevoPedido sucursal={role.sucursal} catalogo={catalogo} saving={saving} onCancel={() => setScreen('lista')} onCreate={crearPedido} />;
    else if (screen === 'detalle' && pedidoActivo) content = <DetallePedido pedido={pedidoActivo} onBack={() => { setScreen('lista'); setActiveId(null); }} onCancelar={pedidoActivo.estado === 'pendiente' ? () => cancelarPedido(pedidoActivo.id) : null} />;
    else content = <VistaSucursal sucursal={role.sucursal} pedidos={pedidos} refreshing={refreshing} onNuevo={() => setScreen('nuevo')} onOpen={(id) => { setActiveId(id); setScreen('detalle'); }} />;
  } else {
    if (screen === 'entrega' && pedidoActivo) content = <VistaEntrega pedido={pedidoActivo} role={role} saving={saving} onBack={() => { setScreen('lista'); setActiveId(null); }} onConfirmar={confirmarEntrega} />;
    else if (screen === 'detalle' && pedidoActivo) content = <DetallePedido pedido={pedidoActivo} onBack={() => { setScreen('lista'); setActiveId(null); }} />;
    else content = (
      <div>
        <div className="flex gap-1.5 mb-5">
          {[['cola', 'Pendientes'], ['historial', 'Historial']].map(([key, label]) => (
            <button key={key} onClick={() => setComprasTab(key)} className="px-3.5 py-1.5 rounded-full text-xs font-bold border"
              style={{ borderColor: comprasTab === key ? C.accent : C.border, background: comprasTab === key ? C.accent : 'transparent', color: comprasTab === key ? '#fff' : C.inkMuted }}>{label}</button>
          ))}
        </div>
        {comprasTab === 'cola'
          ? <VistaComprasCola pendientes={pedidos.filter((p) => p.estado === 'pendiente').sort((a, b) => new Date(a.fecha_creacion) - new Date(b.fecha_creacion))} refreshing={refreshing} onAbrir={(id) => { setActiveId(id); setScreen('entrega'); }} />
          : <VistaHistorial pedidos={pedidos} onOpen={(id) => { setActiveId(id); setScreen('detalle'); }} />}
      </div>
    );
  }

  return (
    <Shell error={error}>
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-1.5 text-xs font-bold" style={{ color: C.accent }}>
          {role.type === 'sucursal' ? <Store size={13} /> : <Truck size={13} />}
          {role.nombre} · {role.type === 'sucursal' ? role.sucursal : 'Compras'}
        </div>
        <div className="flex items-center gap-3">
          <button onClick={abrirCatalogo} className="text-xs font-semibold underline" style={{ color: C.inkMuted }}>Catálogo</button>
          <button onClick={salir} className="text-xs font-semibold underline" style={{ color: C.inkMuted }}>Salir</button>
        </div>
      </div>
      {content}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
